id = "gearbox_veinminer"
name = "Vein Miner"
version = "0.1.0"
description = "Hold the vein key while breaking a block to mine the whole connected vein, or dig in shapes (3x3, 5x5, tunnels, staircases). Enchantments apply per block and each block costs hunger. Inspired by FTB Ultimine; an independent reimplementation."
authors = ["HerculeWu"]
# A wasm mod: Rust in src/, built to mod.wasm by `cargo horizon-mod build --wasm` against the SDK build Cargo.toml pins, beside data/ and assets/.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

